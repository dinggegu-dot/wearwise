name: Pull request checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, build and Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DASHSCOPE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Team progress collector tests
        run: node --test .github/scripts/progress.test.mjs
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Verify Chrome installation
        run: google-chrome --version
      - name: Chrome end-to-end tests
        run: npm run test:e2e
      - name: Verify GitHub Pages export and static behavior
        run: npm run build:pages && npm run test:e2e:pages
      - name: Chrome development mode regression
        run: npm run test:e2e:dev
